name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suite:
    # The pilot injects Win32 scan codes and dwarfs ADB; tests mock both but
    # import the Windows-only modules, so the gate runs on Windows.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Lint (defects only)
        run: python -m ruff check .

      - name: Byte-compile every module
        run: python -m compileall -q . -x "(\.git|models)"

      # Nothing optional is installed here on purpose: the cloud SDK and the
      # chess engine stay absent so the import path is proven to be optional.
      - name: Import gate (optional backends absent)
        env:
          JEV_OFFLINE: "1"
        run: |
          python -c "import universal_brain, jev_brain, pilot_core, embedded_dino, adapters.clash_adapter, adapters.screen_chess_adapter; print('heuristic stack imports clean')"

      - name: Offline regression suite
        env:
          JEV_OFFLINE: "1"
        run: python run_tests.py
